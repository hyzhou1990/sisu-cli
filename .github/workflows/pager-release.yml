name: Pager release assets

# Tag v* builds darwin-arm64 + linux + win32-x64.
# darwin-x64 is dispatch-only (macos-13); missing asset → install-pager 404 → Node TUI.
# vendor/grok-build is gitignored — this job fetches the pin then applies overlays.
# Do not upload placeholder binaries.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated PLATFORM_KEY values'
        required: false
        default: 'darwin-arm64,linux-x64,linux-arm64,win32-x64'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-pager:
    name: pager ${{ matrix.platform }}
    if: ${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, 'darwin-arm64') || contains(github.event.inputs.platforms, 'linux-x64') || contains(github.event.inputs.platforms, 'linux-arm64') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            cargo_target: ''
          - platform: linux-x64
            os: ubuntu-latest
            container: ubuntu:20.04
            cargo_target: ''
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            cargo_target: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 180
    # ubuntu:20.04 container `sh` is dash; `set -o pipefail` is illegal there
    # (v0.3.26 linux-x64 died in 1s). GitHub's bash shell already passes -eo pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Linux pager build deps
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if command -v brew >/dev/null 2>&1; then
            exit 0
          fi
          apt_update() {
            if command -v sudo >/dev/null 2>&1; then sudo apt-get update; else apt-get update; fi
          }
          apt_install() {
            if command -v sudo >/dev/null 2>&1; then sudo apt-get install -y "$@"; else apt-get install -y "$@"; fi
          }
          if ! apt_update; then
            if [ -f /etc/apt/sources.list ]; then
              sed -i 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
              sed -i 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
            fi
            apt_update
          fi
          # Do not apt protobuf-compiler here: Ubuntu 20.04 ships 3.6, which would
          # satisfy `command -v protoc` and skip the GitHub-release install below.
          apt_install curl ca-certificates build-essential pkg-config git unzip
          # Default GCC 9 trips aws-lc-sys (gcc bug 95189). GCC 10 is in focal.
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            apt_install gcc-10 g++-10
          fi

      - name: Fetch pinned grok-build and apply SiSu overlay
        run: |
          set -euo pipefail
          sh scripts/fetch-grok-build.sh
          test -f vendor/grok-build/crates/codegen/xai-grok-pager-bin/src/sisu_access_point.rs
          test -f vendor/grok-build/crates/codegen/xai-grok-shell/src/sisu_access_point.rs

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            ver=27.1
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${ver}/protoc-${ver}-linux-x86_64.zip"
            mkdir -p "$HOME/.local"
            unzip -o /tmp/protoc.zip -d "$HOME/.local"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
            command -v protoc
            protoc --version
            exit 0
          fi
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          if command -v brew >/dev/null 2>&1; then
            brew install protobuf
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          else
            apt-get update
            apt-get install -y protobuf-compiler
          fi

      - name: Build and package .br
        env:
          PLATFORM_KEY: ${{ matrix.platform }}
          CARGO_TARGET: ${{ matrix.cargo_target }}
          INSTALL_HOME: '0'
          PACKAGE_BR: '1'
        run: |
          set -euo pipefail
          if [ -z "${CARGO_TARGET}" ]; then unset CARGO_TARGET; fi
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            export CC=gcc-10 CXX=g++-10
            command -v gcc-10
            gcc-10 --version | head -1
          fi
          sh scripts/build-grok-pager.sh
          test -f "bin/xai-grok-pager-${PLATFORM_KEY}.br"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/xai-grok-pager-${{ matrix.platform }}.br
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-pager-win32:
    name: pager win32-x64
    if: ${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, 'win32-x64') }}
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v6

      - name: Fetch pinned grok-build and apply SiSu overlay
        run: |
          set -euo pipefail
          sh scripts/fetch-grok-build.sh
          test -f vendor/grok-build/crates/codegen/xai-grok-pager-bin/src/sisu_access_point.rs
          test -f vendor/grok-build/crates/codegen/xai-grok-shell/src/sisu_access_point.rs

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          set -euo pipefail
          choco install protoc -y
          command -v protoc || command -v protoc.exe
          protoc --version

      - name: Build and package .br
        env:
          PLATFORM_KEY: win32-x64
          INSTALL_HOME: '0'
          PACKAGE_BR: '1'
        run: |
          set -euo pipefail
          sh scripts/build-grok-pager.sh
          test -f bin/xai-grok-pager-win32-x64.br

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/xai-grok-pager-win32-x64.br
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-pager-x64:
    name: pager darwin-x64
    if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms, 'darwin-x64')
    runs-on: macos-13
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Fetch pinned grok-build and apply SiSu overlay
        run: |
          set -euo pipefail
          sh scripts/fetch-grok-build.sh
          test -f vendor/grok-build/crates/codegen/xai-grok-pager-bin/src/sisu_access_point.rs
          test -f vendor/grok-build/crates/codegen/xai-grok-shell/src/sisu_access_point.rs

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          set -euo pipefail
          brew install protobuf

      - name: Build and package .br
        env:
          PLATFORM_KEY: darwin-x64
          INSTALL_HOME: '0'
          PACKAGE_BR: '1'
        run: |
          set -euo pipefail
          sh scripts/build-grok-pager.sh
          test -f bin/xai-grok-pager-darwin-x64.br

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/xai-grok-pager-darwin-x64.br
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
