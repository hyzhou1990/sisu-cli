name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install, test, typecheck
        run: |
          set -euo pipefail
          npm ci
          npm test
          npx tsc --noEmit

      - name: Pack and run the published bin
        run: |
          set -euo pipefail
          tarball="$(npm pack --json | node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync(0,'utf8')); process.stdout.write(rows[0].filename)")"
          prefix="$(mktemp -d)"
          npm install -g --prefix "$prefix" "./$tarball"
          "$prefix/bin/sisu" --help | grep -q 'npm install -g sisu'
          "$prefix/bin/sisu" --help | grep -q 'sisu login'
