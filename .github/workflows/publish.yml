name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: npm publish sisu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Wait for darwin-arm64 pager asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for i in $(seq 1 80); do
            if gh release view "$tag" --json assets --jq '.assets[].name' \
              | grep -qx 'xai-grok-pager-darwin-arm64.br'; then
              echo "pager asset present"
              exit 0
            fi
            echo "waiting for xai-grok-pager-darwin-arm64.br ($i/80)"
            sleep 30
          done
          echo "timed out waiting for pager-release to upload xai-grok-pager-darwin-arm64.br"
          exit 1

      - name: Test, pack, publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm pack
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; packed but did not publish"
            exit 1
          fi
          npm publish --access public
