name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: npm publish sisu
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Wait for darwin-arm64 and win32-x64 pager assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          need='xai-grok-pager-darwin-arm64.br xai-grok-pager-win32-x64.br'
          for i in $(seq 1 160); do
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=""
            for name in $need; do
              echo "$assets" | grep -qx "$name" || missing="$missing $name"
            done
            if [ -z "$missing" ]; then
              echo "pager assets present"
              exit 0
            fi
            echo "waiting for$missing ($i/160)"
            sleep 30
          done
          echo "timed out waiting for pager-release to upload darwin-arm64 + win32-x64 .br"
          exit 1

      - name: Test, pack, publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm pack
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; packed but did not publish"
            exit 1
          fi
          npm publish --access public
